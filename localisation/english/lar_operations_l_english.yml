 SWI_boost_resistance_buff:0 "\n§YDirenişi Güçlendir§! Operasyonu önemli ölçüde daha etkili hale gelir."
 bruneval_attack:0 "Radar tesisini ele geçir"
 bruneval_attack_desc:0 "Saldırı kuvveti, tesisi ele geçirmek ve tahliye sahilini temizlemek için dört birime ayrılacaktır. Bir uzman radar setini sökecek ve fotoğraflayacaktır. Birim ayrıca sorgulama için bir düşman teknisyenini yakalamaya çalışacaktır."
 bruneval_attack_outcome:0 "Paraşütçüler hedefe doğru hareket etti ve zayıf garnizonu kısa ama şiddetli bir çatışmada yok etti."
 bruneval_exfiltration:0 "Çıkarma gemisi ile tahliye"
 bruneval_exfiltration_desc:0 "Tahliyeyi korumak için asker taşıyan bir çıkarma gemisi filotillası karaya çıkacak ve saldırı kuvvetini alacaktır. Dost donanma kuvvetleri tarafından eskort düzenlenecektir."
 bruneval_exfiltration_outcome:0 "Kuvvet, bir düşman radar teknisyenini sorgulamak üzere yanına alarak hatlarımıza geri taşınmak üzere çıkarma gemilerine bindi."
 bruneval_exfiltration_outcome_fail:0 "Britanya'ya tahliyenin ardından, ajanımızın sahilden kurtarılanlar arasında olmadığı keşfedildi. Tam olarak ne zaman temasın kesildiği belirsiz, ancak en kötüsünü varsaymalıyız."
 bruneval_infiltration:0 "Paraşütle saldırı kuvveti indir"
 bruneval_infiltration_desc:0 "Bir bölük hava indirme birliği toplanacak ve gece düşük irtifadan hedefin yakınına bırakılacaktır."
 bruneval_infiltration_outcome:0 "Saldırı birimi, paraşütle inişten minimum dağılmayla başarılı bir şekilde indi."
 bruneval_raid:0 "Operation Biting"
 bruneval_raid_desc:0 "§LGörünüşe göre düşman, radar geliştirme konusunda bizden önde. Daha fazla istihbarat elde etmek için küçük bir kuvvet tarafından yeterince kararlı bir saldırıyla alınabileceğine inandığımız savunmasız bir konumda bir düşman radar tesisi tespit ettik.§!"
 bruneval_raid_outcome_tt:0 "Kendi araştırmamıza yardımcı olmak için düşman radar teknolojisinin bileşenlerini güvence altına almaya çalışacağız."
 capture_cyphers_bribe:0 "Asker Rüşveti"
 capture_cyphers_bribe_desc:0 "İçeride bir adamımız var ve bir kod defteri çalması ve ajanımıza teslim etmesi için ona gerekli fonları sağlayacağız."
 capture_cyphers_bribe_outcome:0 "Ajanımız, bazı değerli eşyalar karşılığında isimsiz bir kaynaktan kod defterinin tam bir kopyasını elde etti."
 capture_cyphers_raid:0 "Komando Baskını"
 capture_cyphers_raid_desc:0 "Ajanımız bölgeyi keşfedecek ve bir komando birimine karaya çıkıp kod defterlerini ve şifreleme ekipmanını ele geçirmesi için sinyal verecek. Ayrıca sorgulama için bir veya iki şifreleme uzmanını yakalamaya çalışacağız."
 capture_cyphers_raid_outcome:0 "Küçük bir Komando birimi bir radyo istasyonuna başarılı bir baskın düzenledi ve yok edilmeden önce mevcut şifrenin kopyalarını elde etmeyi başardı."
 capture_cyphers_reverse_engineer:0 "Tersine Mühendislik"
 capture_cyphers_reverse_engineer_desc:0 "Ülkenin birincil şifreleme makinesinin daha basit bir versiyonu ticari olarak mevcuttur. Yasal olarak bir versiyon edinecek ve ardından bir şifre çözme makinesini tersine mühendislikle geliştirmemize yardımcı olmak için kullanacağız."
 capture_cyphers_reverse_engineer_outcome:0 "Ajanımız, düşmanın şifreleme makinesinin bir örneğini başarıyla elde etti. Askeri modellerden daha az yetenekli olsa da, yine de operasyonlarına büyük bir içgörü sağlayacaktır."
 capture_cyphers_seduction:0 "Cazibeyi Kullan"
 capture_cyphers_seduction_desc:0 "Ajanımız şifrelere erişimi olan bir kişiyle temas kuracak ve bir kopyasını güvence altına almak için cazibesini veya diğer yolları kullanacaktır."
 capture_cyphers_seduction_outcome:0 "Ajanımız, şifrelere sahip bir kişiyi onlardan vazgeçmeye ikna edebildi."
 capture_cyphers_smuggle:0 "Şifre Kaçakçılığı"
 capture_cyphers_smuggle_desc:0 "Çift taraflı ajanlarımızdan biri, şu anda aktif olan şifrenin yeni bir kopyasının transfer edilmesini talep edecektir. Teslimatın kesintiye uğramamasını sağlamak için diğer servislerle koordinasyon devam etmektedir."
 capture_cyphers_smuggle_outcome:0 "Ajanımız, [From.GetNameDef]'deki temasını onlarla iletişim kurmak için kullanılan şifrelerin tam bir kopyasını göndermeye ikna etmeyi başardı."
 capture_tito:0 "Rösselsprung Operasyonu"
 capture_tito_attack:0 "Ana saldırı"
 capture_tito_attack_desc:0 "Motorlu bir kol, hava indirme birimleriyle birleşmek için ilerleyecek ve bu süreçte ayakta durup savaşan tüm büyük partizan birimlerini yok edecektir."
 capture_tito_attack_outcome:0 "Operasyonun sonucu hakkında daha fazla bilgi için ekteki operasyon raporuna bakın."
 capture_tito_desc:0 "§LYugoslav partizanları güçlendi ve giderek daha cesur ilerlemeler kaydediyorlar. Birçok alanda, kırsalı etkili bir şekilde kontrol ediyorlar, yolları tıkıyorlar ve cezasız bir şekilde faaliyet gösteriyorlar. Bunun anahtarı, bu operasyonları koordine eden ve kontrol eden Partizan lideri Tito'dur. Onu ortadan kaldırmak, bu bölgelerdeki direnişe ciddi bir darbe vuracaktır.§!"
 capture_tito_exfiltration:0 "Bölgeyi güvence altına al"
 capture_tito_exfiltration_desc:0 "İki saldırı kuvveti birleştikten sonra, toparlanacaklar ve hayatta kalan düşmanları temizleyecekler."
 capture_tito_infiltration:0 "Hava indirme kuvvetlerini indir"
 capture_tito_infiltration_desc:0 "İlk paraşütçü dalgası, Tito'nun şüphelenilen sığınağının neredeyse üzerine planörle indirilecektir. Hız ve sürprizi kullanarak, Tito'nun muhafızlarını alt edecekler ve Tito'yu ya yakalayacak ya da öldürecekler."
 capture_tito_outcome_tt:0 "Tito'yu yakalamaya veya öldürmeye çalışacağız. Bu, başarısız olabilecek riskli bir operasyondur."
 collaboration_government_contact_military_officers:0 "Askeri Subaylarla Temas Kur"
 collaboration_government_contact_military_officers_desc:0 "Ekibimiz, bazı emekli askeri subayların mevcut [From.GetAdjective] hükûmetinden derin bir mutsuzluk duyduğunu ve işgalimizden sonra yeni bir hükûmet kurmamıza yardımcı olmaya istekli olacağını gösteren bazı ipuçlarını takip edecektir."
 collaboration_government_contact_military_officers_outcome:0 "Ekibimiz, emekli askeri subaylarla birkaç temas kurdu, bu subaylar içinde bir rol oynamaları koşuluyla yeni bir hükûmet organize etmede yardımcı olmaya ikna edilebilirler."
 collaboration_government_set_up_planning_committees:0 "Planlama Komiteleri Kur"
 collaboration_government_set_up_planning_committees_desc:0 "Ekibimiz, [From.GetNameDef]'i işgal ettikten sonra yönetecek yeni bir hükûmet kurulması olasılığını görüşmek üzere bazı sempatik politikacılarla buluşacak ve ayrıntıları çalışacak bazı küçük çalışma grupları oluşturacaktır."
 collaboration_government_set_up_planning_committees_outcome:0 "Ekip, yeni hükûmeti organize etmek ve muharebe operasyonları bittikten sonra sorunsuz bir güç geçişi sağlamak için bir dizi planlama grubu kurdu."
 collaboration_government_train_paramilitary_forces:0 "Paramiliter Güçleri Eğit"
 collaboration_government_train_paramilitary_forces_desc:0 "Ekibimiz, yeni hükûmete yasa ve düzeni sürdürmede yardımcı olacak bazı birimleri organize edecek ve eğitecektir. Yeni hükûmet organize edilene kadar, arka bölgeleri güvence altına almada yardımcı olacaklar."
 collaboration_government_train_paramilitary_forces_outcome:0 "Ekip, ilerleyen ordumuzun arkasını korumada yardımcı olacak, bazıları askeri deneyime sahip bir dizi güvenilir adamı küçük paramiliter birimler halinde organize etti."
 coordinate_strike_mark_targets:0 "Hedefleri İşaretle"
 coordinate_strike_mark_targets_desc:0 "Ekip, kuvvetlerimizin yüksek değerli hedefleri daha kolay tespit etmesini sağlamak için önceden ayarlanmış sinyaller ve işaretçiler kullanacaktır."
 coordinate_strike_mark_targets_outcome:0 "Kısa sürede ve karanlıkta yapılması gerekmesine rağmen, işaretlemeler kuvvetlerimizi en önemli hedeflere yönlendirmede çok başarılı oldu."
 coordinated_strike_direct_units:0 "Birlikleri Yönlendir"
 coordinated_strike_direct_units_desc:0 "Saldırı başladığında, ekibimiz birliklerimizi telsizle en değerli hedeflere yönlendirecektir."
 coordinated_strike_direct_units_outcome:0 "Ekibimiz birliklerimizi yönlendirmede çok başarılı oldu ve düşmana verilen hasarı artırdı."
 coordinated_strike_occupy_bridges:0 "Köprüleri İşgal Et"
 coordinated_strike_occupy_bridges_desc:0 "Ekibimiz bölgedeki köprüleri ele geçirecek, yıkımlarını önleyecek ve düşman karşı saldırılarını engelleyecektir."
 coordinated_strike_occupy_bridges_outcome:0 "Ekip, kilit bir köprüdeki muhafızları başarıyla alt etti ve yıkım şarjlarının tellerini kesti, bu da kuvvetlerimizin engelsiz ilerlemesini sağladı."
 coordinated_strike_sabotage_communications:0 "İletişimi Sabote Et"
 coordinated_strike_sabotage_communications_desc:0 "Ekibimiz, kritik ilk birkaç saat içinde düşman iletişimini kesmek için telefon hatlarını kesecek ve habercilere pusu kuracaktır."
 coordinated_strike_sabotage_communications_outcome:0 "Ekibimiz düşman iletişimini başarıyla kesintiye uğrattı ve bu da saldırımıza yavaş bir yanıt verilmesine yol açtı."
 coordinated_strike_scout_target:0 "Hedefleri Keşfet"
 coordinated_strike_scout_target_desc:0 "Ekip hedefleri keşfedecek, fotoğraflar çekecek ve yüksek değerli hedeflerin konumu hakkında en son bilgileri sağlayacaktır."
 coordinated_strike_scout_target_outcome:0 "Ekip, saldırı başlamadan sadece saatler önce düşman karargahlarının ve diğer önemli yerlerin konumu hakkında doğru bilgi sağladı."
 coordinated_strike_tt:0 "§Y[From.GetNameDef]§!'e sürpriz bir saldırıyla savaş ilan edeceğiz. Aktive edildiğinde, hedef bölgedeki tüm hazırlanmış Liman Saldırısı ve Stratejik Bombalama, hava savunmasının onları önleyemeden birden çok kez uygulanacaktır."
 enemy_has_equal_or_better_radar_tech_trigger_tt:0 "Düşman eşit veya daha iyi radar teknolojisine sahip."
 exfiltration_air_pickup:0 "Uçakla Alma"
 exfiltration_air_pickup_desc:0 "Uçaklarımızdan biri gece düşman topraklarına geçecek, işaretlenmiş bir alanı bulacak, inecek ve ajanlarımızı alacak."
 exfiltration_air_pickup_outcome:0 "Küçük kurye uçağı, alım noktasını pek sorun yaşamadan bulmayı başardı ve ekibi güvenli bir şekilde hatlarımıza geri getirdi."
 exfiltration_air_pickup_outcome_fail:0 "§RPilotumuz belirlenen iniş yerini birkaç düşman uçaksavar biriminden gelen projektörlerle parlak bir şekilde aydınlatılmış buldu ve operasyonun deşifre olduğuna karar verdi.§!"
 exfiltration_border:0 "Sınırı yürüyerek geçme"
 exfiltration_border_desc:0 "Ajanlarımız gece uzak bir yerden sınırı geçerek kaçacak. Yerel rehberler, tehlikeli bölgede gezinmeye yardımcı olmak için hazır bekliyor."
 exfiltration_border_outcome:0 "Ekip, gece karanlığından yararlanarak sınırı geçerek kaçtı ve sınır savunmalarından bir yol bulmalarına yardımcı olması için yerel bir rehber kullandı."
 exfiltration_border_outcome_fail:0 "§RSınırın diğer tarafındaki rehber, ekibimizin ortaya çıkmasını boşuna bekledi, ta ki yaklaşan bir düşman devriyesi nedeniyle görevini terk etmek zorunda kalana kadar.§!"
 exfiltration_go_to_ground:0 "Yere inme"
 exfiltration_go_to_ground_desc:0 "Ajanlarımız bir sonraki göreve hazır olana kadar ortalıkta görünmeyecek ve nüfusa karışacak. Başka yollarla tahliye etme fırsatı ortaya çıkarsa, bunu değerlendirecekler."
 exfiltration_go_to_ground_outcome:0 "Ekibimiz yerel sivillerin arasına karıştı ve şu anda ya hatlarımıza geri dönme ya da daha fazla görev için bölgede kalma planları yapıyor."
 exfiltration_go_to_ground_outcome_fail:0 "§REkip, önceden ayarlanmış program sırasında şimdiye kadar temas kuramadı. Onlara ne olduğu hakkında daha fazla bilgimiz yok.§!"
 exfiltration_submarine_pickup:0 "Denizaltı ile Alma"
 exfiltration_submarine_pickup_desc:0 "Denizaltılarımızdan biri kıyı boyunca belirlenmiş bir alım noktasında görevde olacak. Düşman deniz devriyeleri bölgeyi kapsadığı için zamanlama çok önemli olacaktır."
 exfiltration_submarine_pickup_outcome:0 "Yerel bir düşman devriyesiyle birkaç gergin gün saklambaç oynadıktan sonra, ekibimiz bir alım ayarlamayı ve bölgeyi tespit edilmeden terk etmeyi başardı."
 exfiltration_submarine_pickup_outcome_fail:0 "§RDenizaltı, kararlaştırılan çıkarma noktasında birkaç saat bekledi, ancak kıyıdan ekibimizin çıkarmaya hazır olduğunu belirten hiçbir mesaj alınmadı. Mürettebat, o dönemde kıyıda artan düşman faaliyeti bildirdi.§!"
 fake_intel_decoy_tanks:0 "Sahte Tanklar"
 fake_intel_decoy_tanks_desc:0 "Uzaktan tank gibi görünen ucuz sahte araçlar icat ettik. Bunları kolayca gözlemlenebilir yerlere yerleştireceğiz ve düşmanın onları fark etmek için bolca zamanı olduğundan emin olacağız."
 fake_intel_decoy_tanks_outcome:0 "Düşman bölgede birkaç keşif Seferi yapsa da, sahte araçları fark ettiklerinden ve onlara inandıklarından emin olamayız. Yemi yuttuklarına dair diğer kaynaklardan teyit bekliyoruz."
 fake_intel_deliberate_leaks:0 "Kasıtlı Sızıntılar"
 fake_intel_deliberate_leaks_desc:0 "Yabancı ülkelerdeki bazı ajanlarımız, doğru insanların yanında ağzı gevşek davranmalarını sağlayacak ve böylece düşmanın istenen bilgiyi 'güvenilir' kaynaklar aracılığıyla almasını sağlayacaktır."
 fake_intel_deliberate_leaks_outcome:0 "Düşman ajanlarına tamamen farklı bir gerçeklik resmi çizen bir dizi küçük sızıntı sağladığımızdan emin olduk. Diğer tarafın buna kanıp kanmadığı henüz belli değil."
 fake_intel_plant_evidence:0 "Kanıt Yerleştir"
 fake_intel_plant_evidence_desc:0 "Düşmanın kontrol ettiği ancak şu anda ilgilenmediğimiz bir yerde küçük bir operasyon düzenleyeceğiz ve arkamızda bol miktarda kanıt bıraktığımızdan emin olacağız."
 fake_intel_plant_evidence_outcome:0 "Yaptığımız baskın tam bir başarıydı ve diğer taraf operasyonumuzun bol miktarda kanıtını buldu. İlk raporlar, buna yanıt olarak zaten bir dizi birlik hareketi olduğunu gösteriyor."
 fake_intel_press_releases:0 "Basın Bültenleri"
 fake_intel_press_releases_desc:0 "Muhabirleri, düşmanın bilmesini istediğimiz bazı şeyler hakkında çok ayrıntılı hikayeler yazmaya davet edeceğiz."
 fake_intel_press_releases_outcome:0 "Halkla İlişkiler Departmanımız, dost ve tarafsız gazetelerdeki basın haberlerinin kabaca istediğimiz gibi görünmesini sağladı."
 fake_intel_radio_deception:0 "Telsiz Aldatmacası"
 fake_intel_radio_deception_desc:0 "Çok daha büyük bir oluşum için sinyal müfrezesi gibi davranan küçük bir telsiz uzmanı birimi kuracağız. Ayrıca, düşmanın mesajlarını okumasını kolaylaştırmak için şifrelerimizin daha eski bir versiyonunu kullanacaklar."
 fake_intel_radio_deception_outcome:0 "Telsiz operatörlerimiz çok fazla trafik üretti. Düşmanın herhangi birini gerçekten izleyip izlemediğini söylemek zor."
 fake_intel_release_pow:0 "Savaş Esirini Serbest Bırak"
 fake_intel_release_pow_desc:0 "Yakalanan bir düşman subayı, insani gerekçelerle ülkesine geri gönderilmek üzere. Ayrılmadan önce, kazara bir dizi şeyi görmesini sağlayacağız."
 fake_intel_release_pow_outcome:0 "Subay, birkaç askeri kampa yakın bir yerden sürüldü ve aslında var olmayan tümenlere ait çeşitli birlik yamalarını fark etmesine izin verildi."
 fake_intel_utilize_double_agents:0 "Çift Taraflı Ajanları Kullan"
 fake_intel_utilize_double_agents_desc:0 "Düşman istihbarat servisinin bir dizi alt düzey muhbirini tarafımıza çektik. Diğer tarafa doğru türde bilgi sağlamaları için teşvik edilecekler."
 fake_intel_utilize_double_agents_outcome:0 "Çift taraflı ajanlarımız diğer tarafa cömert bir bilgi yardımı sağladı - bazıları düşmanın onlara güvenmeye devam etmesini sağlamak için doğru bile."
 free_agency_upgrade_tt:0 "Bir rastgele §YAjanlık Yükseltmesi§! kazan!"
 free_operative_free_in_transit:0 "Nakil Sırasında Kurtar"
 free_operative_free_in_transit_desc:0 "Operatifimiz, tutuldukları hapishane ile sorgulandıkları yer arasında arabayla taşınıyor. Rotayı biliyoruz ve bir pusu kurmak, muhafızları öldürmek ve operatifimizi kurtarmak için küçük bir birim göndereceğiz."
 free_operative_free_in_transit_outcome:0 "Küçük bir Komando biriminin desteğiyle, ekibimiz bir pusu kurmayı ve yeni bir yere taşınırken ajanımızı kurtarmayı başardı."
 free_operative_liberate_camp:0 "Kampı Kurtar"
 free_operative_liberate_camp_desc:0 "Sorgulama altındayken, operatifimiz diğer önemli mahkumlarla birlikte bir kampta tutuluyor. Kampa küçük bir birimle bir saldırı düzenleyecek, mevcut tüm muhafızları alt edecek ve ajanımızı kurtaracağız."
 free_operative_liberate_camp_outcome:0 "Mahkumların taşınmasından sadece saatler önce, küçük bir Komando birimi ajanımızın tutulduğu hapishaneyi kurtarmayı başardı."
 free_operative_smuggle_in_escape_gear:0 "Kaçış Malzemesi İçeri Sızdır"
 free_operative_smuggle_in_escape_gear_desc:0 "Bilim adamlarımız bir dizi kaçış aleti geliştirdi. Paketi almayı kabul eden yerel bir temasımız var. Operatifimiz daha sonra verilen araçları kullanacak ve tahliye için buluşma noktasına doğru yol alacaktır."
 free_operative_smuggle_in_escape_gear_outcome:0 "Ajanımız kaçış aletlerini aldı ve gece karanlığından yararlanarak hapishaneden başarıyla kaçtı, temas kurabilmeden önce birkaç gün boyunca arama ekiplerinden ve devriyelerden kaçtı."
 heavy_water_attack:0 "Ağır Su Tesisini Sabote Et"
 heavy_water_attack_desc:0 "Tesisteki güvenliğin gevşek olduğu bildiriliyor. Bize devriye programlarını sağlayan içeriden bir direniş üyemiz var. İçeri girdikten sonra, ekibimiz patlayıcıları yerleştirecek ve bunun düzenli bir askeri operasyon olduğuna dair kanıt bırakacaktır."
 heavy_water_attack_outcome:0 "Ekip, tüm muhafızlardan kaçınarak tesise başarıyla sızdı. Bir saatten az bir süre sonra, büyük bir patlama tesisi yıktı."
 heavy_water_exfiltration:0 "Tahliye"
 heavy_water_exfiltration_desc:0 "Ekip ayrılacak ve ya yerel direniş birimlerine katılacak ya da dost hatlarına geri dönmeye çalışacaktır."
 heavy_water_exfiltration_outcome:0 "Baskından bu yana ekipten hiçbir haber alamadık, ancak bu bekleniyor."
 heavy_water_exfiltration_outcome_fail:0 "Alman kaynakları, Operation Gunnerside ekibinin yakalandığını duyurdu. Görünüşe göre ekip, tesisten kaçarken sorun yaşadı."
 heavy_water_infiltration:0 "Hava indirme saldırı ekibi ve malzemeleri"
 heavy_water_infiltration_desc:0 "Modifiye edilmiş bir bombardıman uçağı, bir ileri ekiple ve yerel direnişle birleşmek üzere bölgeye küçük bir Norveçli komando ekibi bırakacaktır."
 heavy_water_infiltration_outcome:0 "Ekip, bölgeye başarılı bir şekilde paraşütle indi."
 heavy_water_raid:0 "Gunnerside Operasyonu"
 heavy_water_raid_desc:0 "§LAlmanlar, Norveç'teki bir tesiste, muhtemelen bir atom bombası geliştirme programıyla bağlantılı olarak Ağır Su üretmeye başladılar. Üretilen Ağır Su, böyle bir silah yapmalarına yetmese bile, şüphesiz araştırmalarında onlara büyük ölçüde yardımcı olacaktır.§!"
 heavy_water_raid_outcome_tt:0 "Alman Ağır Su Tesisi'ni yok etmeye çalışacak, nükleer araştırma projelerinde bir atılımı önleyeceğiz."
 infiltrate_civil_service_outcome:0 "Bir dizi güvenilir kişiyi iktidar pozisyonlarına yerleştirdik, bu da onların kurtarılmış toprakları yönetmeyi hızla devralmalarını sağladı."
 infiltrate_military_bribe:0 "Rüşvet Teklif Et"
 infiltrate_military_bribe_desc:0 "Ajanımız, mali zorluk içinde olan bir kişiyi tespit edecek ve bize destek sağlaması için önemli bir meblağ teklif edecektir. Fonlar hazineden sağlanacaktır."
 infiltrate_military_bribe_outcome:0 "Ajanımız, aktif görevdeki bir askeri önemli bir miktar para karşılığında bizim için çalışmaya başarıyla ikna etti."
 infiltrate_military_ideological_supporter:0 "İdeolojik Destekçiyle Temas Kur"
 infiltrate_military_ideological_supporter_desc:0 "[From.GetAdjective] yönetiminin, hükûmetleri tarafından paylaşılmayan siyasi görüşlere sahip üyelerini tespit etmek ve onlarla temas kurmak için diplomatik arka kanalları kullanacak ve onları bizim için çalışmaya teşvik edeceğiz."
 infiltrate_military_ideological_supporter_outcome:0 "Ajanımız, artık mevcut [From.GetAdjective] rejimini desteklemeyen bir dizi subayla temas kurdu."
 infiltrate_military_seduction:0 "Cazibeyi Kullan"
 infiltrate_military_seduction_desc:0 "Ajanımız, bilgi ve koz elde etmek için içeriden biriyle çok yakın ve samimi bir ilişkiye girecektir."
 infiltrate_military_seduction_outcome:0 "Ajanımız, oldukça güvenilir bir bilgi kaynağı haline gelen aktif bir askerle bir ilişkiye başladı."
 infiltrate_military_turned_pow:0 "Savaş Esirini Taraf Değiştir"
 infiltrate_military_turned_pow_desc:0 "Gözetimimizdeki kullanılabilir bir Savaş Esirini tespit edecek, onu kendi tarafımıza çekecek ve ardından ülkesine geri göndereceğiz. Şüphesiz sorgulanacaktır, ancak uygun eğitimle bunun üstesinden gelebilecektir."
 infiltrate_military_turned_pow_outcome:0 "Psikolojik Operasyonlar Departmanımız, bir savaş esirini davamızın adaletine başarıyla ikna etti ve onu diğer tarafa geri gönderdi."
 infiltration_border:0 "Tarafsız bir sınır üzerinden sızma"
 infiltration_border_desc:0 "Ajanlar tarafsız bir sınır üzerinden sızacak. Bölgedeki sınır muhafızlarının daha az uyanık olması bekleniyor ve sınır devriyelerinin çok seyrek olduğu bir dizi alanı zaten belirledik."
 infiltration_border_outcome:0 "Çok olumsuz hava koşullarının altında, ekibimiz daha önce keşfedilen patikayı buldu ve daha fazla sorun yaşamadan sınırı geçti."
 infiltration_diplomatic:0 "Diplomatik Pasaportlar"
 infiltration_diplomatic_desc:0 "Ajanlar ülkeye girmek ve dolaşmak için diplomatik pasaportlar kullanacak. Düşman karşı istihbaratının onları takip etmeye çalışmasını bekliyoruz, ancak bu yeterli eğitimle aşılabilir."
 infiltration_diplomatic_outcome:0 "Ekip ülkeye girmekte hiç sorun yaşamadı ve düşman karşı istihbaratının peşlerine taktığı takibi ustaca atlattı."
 infiltration_paradrop:0 "Paraşütle Sızma"
 infiltration_paradrop_desc:0 "Ajanlar bölgeye paraşütle bırakılacak. Alçaktan ve gece uçmak, düşman avcı uçaklarının herhangi bir müdahalesini önleyecektir."
 infiltration_paradrop_outcome:0 "Karanlıkta iniş bölgesini bulmada biraz sorun yaşanmasına rağmen, ekip güvenli bir şekilde indi."
 infiltration_submarine:0 "Denizaltı ile Konuşlandırma"
 infiltration_submarine_desc:0 "Ajanlar, denizaltılarımızdan biri tarafından kıyıya yakın bir yere bırakılacak. Tespit edilmekten kaçınmak için olası çıkarma alanlarını ve düşman devriyelerinin zamanlamasını zaten keşfettik."
 infiltration_submarine_outcome:0 "İlk deneme yüksek dalgalar tarafından engellendikten sonra, ertesi gün ikinci bir çıkarma denemesi başarıyla karşılandı ve ekibi güvenli bir şekilde kıyıya ulaştırdı."
 intelligency_agency_resistance_boost_tt:0 "İstihbarat Operasyonları: $VALUE|=-%0$"
 lar_communist_uprising_infiltrate_civil_service:0 "Devlet Memurluğuna Sız"
 lar_communist_uprising_infiltrate_civil_service_desc:0 "Ajanımız, devrim başarılı olduktan sonra sivil bir yönetim için çekirdeği oluşturmak üzere birkaç güvenilir kişinin devlet hizmetine girmesini sağlayacaktır."
 lar_communist_uprising_organise_cells:0 "Devrimci Hücreler Organize Et"
 lar_communist_uprising_organise_cells_desc:0 "Ajanlarımız, devrimin tohumlarını her fabrikaya taşımak için Devrimci Eylem Komiteleri oluşturmak üzere birkaç seçkin işçiyle çalışacaktır."
 lar_communist_uprising_organize_strikes:0 "Grevler Düzenle"
 lar_communist_uprising_organize_strikes_desc:0 "Ajanımız, sendikalara ve kilit endüstrilerde çalışan diğer siyasi olarak güvenilir kişilere ulaşacak ve savaş başladığında uygulanmak üzere bir grev düzenlemelerine yardımcı olacaktır."
 lar_communist_uprising_train_workers_militia:0 "İşçi Milislerini Eğit"
 lar_communist_uprising_train_workers_militia_desc:0 "Ajanımız, daha sonra milis birimlerinin kadrosunu oluşturacak olan bir dizi özenle seçilmiş yoldaş için temel eğitim organize edecektir."
 lar_fra_coup_pre_position_units:0 "Birlikleri Önceden Konumlandır"
 lar_fra_coup_pre_position_units_desc:0 "Ajanımız, bölgedeki bir dizi sempatik ordu biriminin sorumluluğunu alacak ve operasyon başladığında ele geçirilecek hedefler atayacaktır."
 lar_fra_launch_coup:0 "Darbeyi Başlat"
 lar_fra_launch_coup_desc:0 "Operasyonlar, kodlanmış bir radyo sinyalinin alınması üzerine başlayacaktır."
 launch_coup_exfiltration_outcome:0 "Başlama sinyalini aldıktan sonra, ajanımız birkaç birimi atanmış hedeflerini ele geçirmeye yönlendirdi. İsyancılar, bir toprak parçasının kontrolünü başarıyla ele geçirdi."
 launch_coup_exfiltration_outcome_fail:0 "Ayaklanmanın kargaşasında, operatifimizle teması kaybettik. Ne olduğunu asla öğrenemeyebiliriz."
 murder_trotsky:0 "Gizli Suikast"
 murder_trotsky_attack:0 "Suikast"
 murder_trotsky_attack_desc:0 "Ajanımız, özel olarak tartışmak istediği bir makaleyi göstererek Troçki'yi muhafızlarından ayıracaktır. Yalnız kaldığında, Troçki'yi bir buz kazmasıyla öldürecektir."
 murder_trotsky_attack_outcome:0 "Ajan, Troçki'yi yalnız yakalamayı başardı ve bir buz kazmasıyla ağır bir darbe vurdu. Bu Troçki'yi hemen öldürmedi, ancak daha sonra hastanede öldü."
 murder_trotsky_desc:0 "Doğrudan bir saldırının başarılı olması pek olası değil. Troçki'ye yaklaşmak için daha gizli yollar kullanmalı ve ardından arkası dönükken onu indirmeliyiz."
 murder_trotsky_exfiltration:0 "Kaçış"
 murder_trotsky_exfiltration_desc:0 "Ajanımız, karışıklığı ve kaosu kullanarak kaçmaya ve sorgulamadan kaçınmaya çalışacaktır."
 murder_trotsky_exfiltration_outcome:0 "Saldırıyı takip eden karışıklıkta, ajanımız kimsenin yüzünü iyi görmeden kaçmayı başardı."
 murder_trotsky_exfiltration_outcome_fail:0 "Ajanımız Troçki'nin muhafız detayı tarafından yakalandı ve yetkililere teslim edildi. Cinayetle suçlandı."
 murder_trotsky_infiltration:0 "Sahte Belgeler"
 murder_trotsky_infiltration_desc:0 "Sahte bir Kanada pasaportu kullanarak, Ajanımız Troçki'nin bulunduğu yere seyahat edecek ve muhafızlarıyla arkadaş olacaktır."
 murder_trotsky_infiltration_outcome:0 "Ajanımız, sahte pasaportunun sağladığı erişimi kullanarak Troçki'nin ve muhafızlarının güvenini başarıyla kazandı."
 murder_trotsky_outcome_tt:0 "Troçki'yi çevresine yerleştirdiğimiz bir ajanı kullanarak suikast girişiminde bulunacağız."
 nuclear_espionage:0 "Atom Programına Sız"
 nuclear_espionage_desc:0 "Nükleer silah programımız diğer ülkelerin gerisinde. Yabancı atom silahları programlarına sızmak ve hayati planlar ve veriler elde etmek için bir operasyon planlamalıyız."
 nuclear_espionage_outcome_tt:0 "[FROM.GetAdjective] nükleer araştırma programının içine, kendi atom projemizde kullanılabilecek teknik belgeleri geçirmeye çalışacak bir ajan yerleştireceğiz."
 operation_boost_resistance:0 "Direnişi Güçlendir"
 operation_boost_resistance_desc:0 "§LDüşman işgali altındaki topraklardaki partizanlar, mücadeleye devam etmek için umutsuzca destek bekliyor. Önemli miktarda düşman birliğini meşgul ediyorlar ve çok etkili bir yatırım olurlar.§!"
 operation_capture_cipher:0 "Şifre Ele Geçir"
 operation_capture_cipher_desc:0 "§LBir düşman kod defterini ele geçirmek veya başka yollarla elde etmek, şifre kırıcılarımıza çabalarında belirleyici bir avantaj sağlayacaktır.§!"
 operation_collaboration_government:0 "İşbirlikçi Hükûmet Hazırla"
 operation_collaboration_government_desc:0 "§L[From.GetNameDef]'in başında dost bir hükûmet olması, diğer düşmanlarımıza odaklanmamıza ve diğer hedefleri takip etmek için birlikleri serbest bırakmamıza olanak tanır.§!"
 operation_coordinated_strike:0 "Koordineli Saldırı"
 operation_coordinated_strike_desc:0 "§L[From.GetNameDef] üzerinde zafer kazanmak için, ezici bir sürpriz darbe vurmalıyız.§!\n\nHedef bölgede §YLiman Saldırısı§! ve §YStratejik Bombalama§! hava görevleri hazırlayın ve operasyon tamamlandığında saldıracaklar ve aramızda savaş başlatacaklar."
 operation_coup_government:0 "Darbe Düzenle"
 operation_coup_government_desc:0 "§L[From.GetNameDefCap] bir rejim değişikliği için olgunlaşmış durumda. Birkaç iyi, güvenilir insan - uygun destekle - [From.GetAdjective] hükûmetini ayakta tutan çürük yapıyı devirebilir.§!"
 operation_fake_intel:0 "Sahte İstihbarat Yerleştir"
 operation_fake_intel_desc:0 "§L[From.GetAdjective] İstihbaratının ülkemizde aktif olduğunu biliyoruz. Bazen, bilgi arayan birine tam olarak duymak istediklerini vermek daha iyidir.§!"
 operation_infiltrate_armed_forces_airforce:0 "Hava Kuvvetlerine Sız"
 operation_infiltrate_armed_forces_airforce_desc:0 "§L[From.getAdjective] Hava Kuvvetleri, [From.GetAdjective] silahlı kuvvetlerinin en gencidir. Bu nedenle, saflarında alışılmadık geçmişlere sahip birçok insan vardır. İçeriye bir adam sokmak için bunlardan bazılarını sömürebiliriz.§!"
 operation_infiltrate_armed_forces_army:0 "Orduya Sız"
 operation_infiltrate_armed_forces_army_desc:0 "§L[From.GetAdjective] Ordusu'nun saflarında, gelecekteki operasyonlar için ek bilgi ve destek sağlamak üzere tarafımıza çekilebilecek bir dizi kişi bulunmaktadır.§!"
 operation_infiltrate_armed_forces_navy:0 "Donanmaya Sız"
 operation_infiltrate_armed_forces_navy_desc:0 "§L[From.GetAdjective] gemilerinin sıkı sıkıya bağlı mürettebatı sızma için az sayıda yol sunarken, anavatandaki destek personeli başka bir konudur. İçeriye birini sokmak bize değerli bilgiler verecek ve daha sonra daha zor operasyonları destekleme fırsatı sunacaktır.§!"
 operation_infiltrate_civilian:0 "Sivil Yönetime Sız"
 operation_infiltrate_civilian_desc:0 "§L[From.GetAdjective] hükûmetinin, bir ajanı operasyonlarına sızdırabileceğimiz çok sayıda zayıf noktası vardır. Bunu yapmak, [From.GetNameDef]'in iç işleyişi hakkında bize değerli bir içgörü kazandıracak ve gelecekteki operasyonlarda [From.GetNameDef]'e karşı bu ajanı kullanma fırsatı verecektir.§!"
 operation_make_resistance_contacts:0 "Direniş Temasları Kur"
 operation_make_resistance_contacts_desc:0 "§LDüşman hatlarının gerisinde aktif olan partizanlara sunabileceğimiz herhangi bir destek, onlarla iletişim kurmanın ve koordine olmanın bir yolunu bulursak çok daha etkili olacaktır.§!"
 operation_outcome_consumes_token_tt:0 "Bu operasyon bir §YSızdırılmış Varlığı§! yakabilir."
 operation_outcome_sabotage_industry_tt:0 "Yerel direnişi sanayiyi hedeflemeye odaklar ve başarılı saldırı olasılığını artırır."
 operation_outcome_sabotage_infrastructure_tt:0 "Yerel direnişi altyapıyı hedeflemeye odaklar ve başarılı saldırı olasılığını artırır."
 operation_outcome_sabotage_resources_tt:0 "Yerel direnişi kaynak çıkarımını hedeflemeye odaklar ve başarılı saldırı olasılığını artırır."
 operation_rescue_operative:0 "Yakalanan Operatifi Kurtar"
 operation_rescue_operative_desc:0 "§LVarlıklarımızdan biri düşman tarafından saf dışı bırakıldı. Kalıcı olarak oyundan çıkarılmadan önce onu geri almalı ve bunu hızla yapmalıyız.§!"
 operation_steal_tech_airforce:0 "Havacılık Sanayii Planlarını Çal"
 operation_steal_tech_airforce_desc:0 "§LDüşmanın uçak tasarımının çeşitli alanlarında bizden önde olduğuna dair çok endişe verici bir dizi rapor aldık. Eğer durum buysa, tam olarak ne kadar ileride olduklarına dair içgörüler kazanmaya çalışabilir ve bu bulguları kendi araştırmamızı ilerletmek için kullanabiliriz.§!"
 operation_steal_tech_army:0 "Askeri Planları Çal"
 operation_steal_tech_army_desc:0 "§Lİstihbarat analistlerimiz, [From.GetNameDef]'in Kara Savaşı ve askeri mühendislik alanında önemli ilerlemeler kaydettiğine inanıyor. Daha kapsamlı bir soruşturma ve bazı daha doğrudan yöntemlerle birleştiğinde, kendi araştırma projelerimiz için bazı değerli bilgiler ortaya çıkabilir.§!"
 operation_steal_tech_civilian:0 "Endüstriyel Planları Çal"
 operation_steal_tech_civilian_desc:0 "§LGörünüşe göre sanayimiz birkaç alanda [From.GetNameDef]'in gerisinde kalıyor. Biraz kurnazlık ve biraz hile ile aradaki farkı önemli ölçüde kapatabiliriz.§!"
 operation_steal_tech_navy:0 "Donanma Planlarını Çal"
 operation_steal_tech_navy_desc:0 "§L[From.GetAdjective]'in donanma mühendisliğinin bazı alanlarında bizden önde göründüğüne dair raporlar var. Tersine mühendislik için bu teknolojinin bir kısmını elde etme konumunda olabiliriz.§!"
 operation_targeted_sabotage_industry:0 "Sanayiyi Sabote Et"
 operation_targeted_sabotage_industry_desc:0 "§LDüşman toprağındaki direniş, yerel bir sanayi tesisini devre dışı bırakma konusunda destek istedi.§!"
 operation_targeted_sabotage_infrastructure:0 "Altyapıyı Sabote Et"
 operation_targeted_sabotage_infrastructure_desc:0 "§LDüşman toprağındaki direniş, düşman altyapısına karşı düşük profilli bir çaba yürütüyor, ancak şimdiye kadar ağır bir etki yaratmak için kaynaklardan yoksundu.§!"
 operation_targeted_sabotage_resources:0 "Kaynakları Sabote Et"
 operation_targeted_sabotage_resources_desc:0 "§LDüşman toprağındaki direniş, düşmanın eyalette kaynak çıkarma çabaları hakkında bizi bilgilendirdi. O planlara atılacak iyi yerleştirilmiş bir çomak bunu önleyecektir.§!"
 operation_warsaw_uprising:0 "Varşova Ayaklanması"
 operation_warsaw_uprising_desc:0 "Polonya'nın cesur direniş savaşçıları, Varşova'yı ve ulusumuzu düşmanlarımızdan kurtarmayı özlüyor. Onlara sadece sinyal vermemiz gerekiyor ve Polonya yeniden yaşayacak!"
 organise_cells_outcome:0 "Birkaç devrimci hücre organize edildi ve düşman gerisinde faaliyet göstermeye başladı."
 organize_strikes_outcome:0 "Ajanımız, sendikacıları ve işçileri büyük bir grev başlatmaya başarıyla ikna etti."
 preposition_units_outcome:0 "Ülkedeki varlıklarımız, ayaklanma başladığında kritik altyapıyı ele geçirmek üzere yerleştirildi."
 raid_trotskys_villa:0 "Troçki'nin Villasına Baskın"
 raid_trotskys_villa_attack:0 "Villayı Bas"
 raid_trotskys_villa_attack_desc:0 "Bir NKVD subayı liderliğindeki küçük bir grup villayı basacak, herhangi bir muhafızı alt edecek, Troçki'yi bulacak ve devlete karşı işlediği suçlardan dolayı onu infaz edecektir."
 raid_trotskys_villa_attack_outcome:0 "Ekip villaya girdi ve Troçki'nin muhafızlarıyla bir çatışmaya girdi."
 raid_trotskys_villa_desc:0 "Troçki, Sovyet devletine karşı komplo kurmak için diğer parti üyeleriyle yazışarak villasında saklanıyor. Evine saldırmak ve buna bir son vermek için küçük bir ekip gönderebiliriz."
 raid_trotskys_villa_outcome_tt:0 "Troçki'nin villasına onu öldürmeye çalışmak için küçük bir suikastçı grubu gönderilecek."
 rescue_mussolini:0 "Benito Mussolini'yi Kurtar"
 rescue_mussolini_attack:0 "Hapishaneye saldır"
 rescue_mussolini_attack_desc:0 "Saldırı birimi otele saldıracak ve ele geçirecek ve Mussolini'yi kurtaracaktır. İdeal olarak, garnizon savaşmak yerine teslim olacaktır. Hız ve sürpriz esastır."
 rescue_mussolini_desc:0 "§L[ITA.GetLeader] tarafından devrildikten sonra, Mussolini Apenin dağlarındaki küçük bir otelde tutuklandı. Zaferimizden sonra İtalyan topraklarını yönetmede şüphesiz yardımcı olacak olan onu kurtarmak ve hatlarımıza geri getirmek için küçük bir penceremiz var.§!"
 rescue_mussolini_exfiltration:0 "Uçakla çıkarma"
 rescue_mussolini_exfiltration_desc:0 "Mükemmel kısa alan kabiliyetine sahip küçük bir uçak inecek ve Mussolini'yi alacak, sonra geri dönüp onu dost bir havaalanına uçuracaktır."
 rescue_mussolini_infiltration:0 "Hapishane yakınına planör indir"
 rescue_mussolini_infiltration_desc:0 "Özel olarak seçilmiş bir birim planörlere binecek ve istihbarat servisimizin Mussolini'nin tutulduğunu belirttiği yere olabildiğince yakın bir yere inecek."
 rescue_mussolini_outcome_tt:0 "Mussolini'yi kurtarmaya çalışacağız. Bu, başarısız olabilecek riskli bir operasyondur."
 resistance_contacts_briefings:0 "Strateji Brifingleri"
 resistance_contacts_briefings_desc:0 "Ajanımız, direniş desteğini koordine etmek için çeşitli direniş gruplarının liderlerine planlanan operasyonlar hakkında brifing verecektir."
 resistance_contacts_briefings_outcome:0 "Ekip, direniş üyelerine sektörlerindeki planlanan operasyonlar hakkında talimat verdi, istihbarat toplama için öncelikler belirledi ve ikmal atışları ayarladı."
 resistance_contacts_radio_circuits:0 "Telsiz Devreleri Oluştur"
 resistance_contacts_radio_circuits_desc:0 "Ekip, direniş üyelerine telsizler dağıtacak ve özellikle düşman telsiz yön bulmasını önlemeye yönelik temel telsiz protokolünü öğretecektir."
 resistance_contacts_radio_circuits_outcome:0 "Ekip, birkaç direniş birimiyle temas kurdu ve onlara telsiz tekniği öğretti, her birine bir telsiz operatörü bıraktı."
 resistance_support_arms_depots:0 "İkmal Zulası Oluştur"
 resistance_support_arms_depots_desc:0 "Ajanlarımız, direniş yeterince güçlendiğinde genel bir ayaklanmaya hazırlık olarak bir dizi gizli patlayıcı ve diğer teçhizat zulası kuracak."
 resistance_support_arms_depots_outcome:0 "Ekip, direnişin vuruş gücünü artırmak için gizli yerlerde birkaç silah ve mühimmat deposu kurdu."
 resistance_support_coordinate_groups:0 "Direniş Gruplarını Koordine Et"
 resistance_support_coordinate_groups_desc:0 "Ajanlarımız çeşitli direniş gruplarını koordine etmek için seyahat edecek. Siyasi olarak parçalanmış birimler arasında bir ittifak kurmak biraz çaba gerektirecektir."
 resistance_support_coordinate_groups_outcome:0 "Ekip, operasyonları daha büyük ölçekte düzgün bir şekilde koordine etmek ve ikmalin en çok ihtiyaç duyulan yere yönlendirilmesini sağlamak için en büyük direniş gruplarının temsilcilerini topladı."
 resistance_support_distribute_weapons:0 "Silah Dağıt"
 resistance_support_distribute_weapons_desc:0 "Ajanlarımız bir dizi silah atışını organize edecek ve koordine edecek. Silahlar daha sonra yerel direnişin güvenilir üyelerine verilecektir."
 resistance_support_distribute_weapons_outcome:0 "Ekip, bir dizi direniş hücresine silah dağıttı ve üyelere bunların kullanımını öğretti."
 resistance_support_organize_training:0 "Eğitim Kampları Düzenle"
 resistance_support_organize_training_desc:0 "Ajanlarımız kaçma ve saklanma becerileri ile temel saha zanaatı kursları düzenleyecek. En umut verici öğrenciler daha sonra temel ateşli silahlar eğitimine geçecek."
 resistance_support_organize_training_outcome:0 "Ekip, temel saha zanaatı, hafif silah bakımı ve yıkım konularında kurslar düzenledi."
 resistance_support_pidgeons:0 "Güvercin Dağıt"
 resistance_support_pidgeons_desc:0 "Ekip, direnişle bağlantılı çeşitli yetiştiricilere eğitimli posta güvercinleri dağıtacak. Hatlarımıza geri mesaj taşımak için kullanılacaklar."
 resistance_support_pidgeons_outcome:0 "Bir dizi güvercin, nasıl beslenip bakılacağına dair talimatlarla düşman hatlarının arkasına bırakıldı."
 steal_blueprints_bribe:0 "Rüşvet Teklif Et"
 steal_blueprints_bribe_desc:0 "Ajanımız, projede yer alan bir mühendise önemli bir meblağ teklif edecektir."
 steal_blueprints_bribe_outcome:0 "Mali zorluk içinde bir mühendisle temas kurduk ve bazı dönüştürülebilir para birimi karşılığında bazı gizli kağıtları vermeye ikna ettik."
 steal_blueprints_infiltrate_naval_design_office:0 "Donanma Tasarım Ofisine Sız"
 steal_blueprints_infiltrate_naval_design_office_desc:0 "Ajanımız, donanma inşaatında daha küçük bir tedarikçiye küçük bir çalışan olarak girecek ve bu pozisyonu mevcut planların kopyalarını yapmak için kullanacaktır."
 steal_blueprints_infiltrate_naval_design_office_outcome:0 "Ajanımız bir donanma teçhizatı tedarikçisine başarıyla sızdı ve bir dizi kilit bileşen planının kopyalarını yaptı."
 steal_blueprints_middle_manager:0 "Orta Yönetime Sız"
 steal_blueprints_middle_manager_desc:0 "Ajanımız, büyük bir şirkette orta yönetimde istihdam sağlamak için sağlanan referansları ve üzerinde oynanmış bir CV'yi kullanacaktır. Bu pozisyondan, o şirket ve bir bütün olarak sanayi hakkında bilgi sağlayabilmelidir."
 steal_blueprints_middle_manager_outcome:0 "Ajanımızın küçük bir şirketin yönetiminde geçirdiği zaman, düşman ekonomisi hakkındaki anlayışımızı önemli ölçüde artırdı. Ajanımız orada çalışırken verimliliğin arttığına dair raporları hala araştırıyoruz."
 steal_blueprints_seduction:0 "Cazibeyi Kullan"
 steal_blueprints_seduction_desc:0 "Ajanımız projeyle ilgili bir kişiye yakınlaşacak ve ek bilgiler elde etmek için cazibesini kullanacaktır. Kimsenin kaliteli bir şirket zamanı için tam bir plan seti vermesini beklemesek de, yastık sohbeti genellikle korunmasızdır."
 steal_blueprints_seduction_outcome:0 "Ajanımız, biraz kişisel arkadaşlığa ihtiyacı olan bir mühendis buldu ve bu mühendis işi hakkında çok açık sözlüydü."
 steal_blueprints_steal_prototype:0 "Prototip Çal"
 steal_blueprints_steal_prototype_desc:0 "Temel uçuş eğitiminden geçtikten ve hava kuvvetlerimizin bir test pilotu eşliğinde, ajanımız bir prototipe erişim sağlayacak ve onu bizim hatlarımıza uçuracaktır. Prototipin bize sağlam ulaşmasını sağlamak için bir avcı eskortu ayarlanacaktır."
 steal_blueprints_steal_prototype_outcome:0 "Prototip başarıyla kurtarıldı ve dost bir havaalanına uçuruldu. Mühendislerimiz şimdi onu parçalara ayırıyor."
 targeted_sabotage_burn_storage:0 "Depoyu Yak"
 targeted_sabotage_burn_storage_desc:0 "Yerel direniş, son derece yanıcı bileşikler içeren depolama birimlerini tespit etti. Gecenin karanlığından yararlanarak, operatiflerimiz depoyu ateşe verecek ve ardından ortaya çıkan karışıklıkta geri çekilecektir."
 targeted_sabotage_burn_storage_outcome:0 "Ekip, yerel depolama alanlarını başarıyla ateşe verdi, yüzlerce ton depolanmış kaynağı yok etti ve bir stok sürdürme yeteneğini ciddi şekilde etkiledi."
 targeted_sabotage_collapse_tunnel:0 "Tüneli Çökert"
 targeted_sabotage_collapse_tunnel_desc:0 "Eyaletteki ana demiryolu hattı dar bir tünelden geçiyor. Operatiflerimiz yapıdaki yapısal zayıf noktaları tespit etti ve tüneli çökertmek için patlayıcıları kullanacak."
 targeted_sabotage_collapse_tunnel_outcome:0 "Yapısal zayıf noktaları tespit ettikten sonra, ekip patlayıcıları yerleştirdi ve geri çekildi. Tünele verilen hasar onarılabilir olsa da, tünelin tekrar tam olarak kullanılabilir hale gelmesi biraz zaman alacaktır."
 targeted_sabotage_destroy_bridge:0 "Köprüyü Yok Et"
 targeted_sabotage_destroy_bridge_desc:0 "Yerel direniş, bölgedeki düşman ikmal çabalarının kilit noktasını oluşturan bir köprüyü tespit etti. Operatiflerimiz birkaç kilo yüksek patlayıcıyla köprüyü yıkacaktır."
 targeted_sabotage_destroy_bridge_outcome:0 "Ekip patlayıcıları yerleştirdi ve fitili geçen bir trenle aynı zamana denk gelecek şekilde ayarladı. Patlama ile raydan çıkan trenin hasarı arasında, tüm köprü açıklığı nehre düştü."
 targeted_sabotage_destroy_mining_equipment:0 "Madencilik Ekipmanını Yok Et"
 targeted_sabotage_destroy_mining_equipment_desc:0 "Yerel direniş grupları, madencilikte kullanılan ağır ekipmanların çoğunun son derece savunmasız olduğuna dikkat çekti. Ajanlarımız, tüm madencilik operasyonunu durma noktasına getirmek için bir dizi kritik parçayı devre dışı bırakmak üzere patlayıcıları kullanacaktır."
 targeted_sabotage_destroy_mining_equipment_outcome:0 "Ekip, ağır madencilik ekipmanlarının çoğunu sabote etmeyi başardı. Hasarın bir kısmı yüzeysel olsa da, üretim akışında hala bazı ciddi darboğazlar yaratacaktır."
 targeted_sabotage_immobilize_rolling_stock:0 "Demiryolu Araçlarını Hareketsiz Bırak"
 targeted_sabotage_immobilize_rolling_stock_desc:0 "Bir demiryolu vagonunun yağlama noktalarına bir avuç kum, sonunda onu durma noktasına getirecek ve böylece tamir edilene kadar bir demiryolu hattını bloke edecektir. Az sayıda devre dışı bırakılmış vagon bile tüm sistemi çökertbilir."
 targeted_sabotage_immobilize_rolling_stock_outcome:0 "Ekip bir demiryolu deposuna sızdı ve bir dizi aracı başarıyla sabote etti. Etkiler, araç birkaç kilometre koştuktan sonra, onu açık hatta mahsur bırakarak ancak belirgin hale gelmelidir."
 targeted_sabotage_industry_2_tt:0 "[From.From.GetName]'deki Yerel Direniş, çabalarının daha fazlasını yerel fabrikaları sabote etmeye odaklayacak."
 targeted_sabotage_industry_3_tt:0 "[From.From.GetName]'deki Yerel Direniş, yerel fabrikaları sabote etmek için büyük bir çaba gösterecektir."
 targeted_sabotage_infrastructure_2_tt:0 "[From.From.GetName]'deki Yerel Direniş, çabalarının daha fazlasını yerel altyapıyı sabote etmeye odaklayacak."
 targeted_sabotage_infrastructure_3_tt:0 "[From.From.GetName]'deki Yerel Direniş, yerel altyapıyı sabote etmek için büyük bir çaba gösterecektir"
 targeted_sabotage_organize_more_meetings:0 "Daha Fazla Toplantı Düzenle"
 targeted_sabotage_organize_more_meetings_desc:0 "İşçilerle yapılan görüşmeler, küçük konuları tartışmak için kapsamlı toplantılar düzenlemenin, operatiflerimiz için asgari maliyetle üretimi önemli ölçüde yavaşlatma etkisine sahip olduğunu göstermiştir."
 targeted_sabotage_organize_more_meetings_outcome:0 "Ajanımız hedef şirketin orta yönetimine başarıyla sızdı ve kilit paydaşlarla etkileşimi artırarak daha büyük sinerjiler bulmak için süreçleri agresif bir şekilde yeniden yapılandırdı. Verimlilik önemli ölçüde düştü."
 targeted_sabotage_plant_explosives:0 "Patlayıcı Yerleştir"
 targeted_sabotage_plant_explosives_desc:0 "Yerel direniş üyeleriyle çalışarak, operatiflerimiz gecenin bir yarısı tesise sızacak, taşıyıcı yapıların yanına patlayıcılar yerleştirecek ve böylece tüm fabrika holünü üretim ekipmanının üzerine çökertecektir."
 targeted_sabotage_plant_explosives_outcome:0 "Ekip patlayıcıları başarıyla yerleştirdi ve binayı yıktı. Makine aletlerindeki hasarın hafif olduğu bildiriliyor, ancak yeniden inşa etmek yine de çok zaman alacak."
 targeted_sabotage_remove_roadsigns:0 "Yol İşaretlerini Kaldır"
 targeted_sabotage_remove_roadsigns_desc:0 "Operatiflerimiz, işgal birliklerinin seyrüseferini zorlaştırmak amacıyla sokak tabelalarını devirecek ve diğer yerlerdeki tabelaları ters çevirecektir."
 targeted_sabotage_remove_roadsigns_outcome:0 "Ekip, bir dizi önemli kavşaktaki yol işaretlerini başarıyla kaldırdı ve diğer yerlerdeki işaretleri değiştirerek bölgeye aşina olmayan sürücüler arasında büyük bir kafa karışıklığı yarattı."
 targeted_sabotage_resources_2_tt:0 "[From.From.GetName]'deki Yerel Direniş, çabalarının daha fazlasını yerel kaynak çıkarımını sabote etmeye odaklayacak."
 targeted_sabotage_resources_3_tt:0 "[From.From.GetName]'deki Yerel Direniş, yerel kaynak çıkarımını sabote etmek için büyük bir çaba gösterecektir."
 warsaw_uprising_operation_tt:0 "Polonya'da ulusal bir ayaklanmayı tetikle, eyaletlerinde yeni birimler yarat."
 workers_militia_outcome:0 "Birkaç tabur işçi milisi, kritik tesisleri korumaya hazır bekliyor."
